<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resumo do Pedido</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <section class="card" aria-labelledby="titulo">

      <div class="illustration" aria-hidden="true">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="music-note note-1">♪</div>
        <div class="music-note note-2">♫</div>
      </div>

      <div class="content">
        <h1 id="titulo">Resumo do Pedido</h1>

        <p class="description">
          Você pode ouvir milhões de músicas, podcasts e muito mais.
          Cancele quando quiser.
        </p>

        <div class="plan">
          <div class="plan-icon" aria-hidden="true">♪</div>

          <div class="plan-info">
            <strong>Plano Anual</strong>
            <span>R$ 59,90/ano</span>
          </div>

          <button class="change-button" type="button">
            Alterar
          </button>
        </div>

        <button class="payment-button" type="button">
          Continuar para o pagamento
        </button>

        <button class="cancel-button" type="button">
          Cancelar pedido
        </button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
